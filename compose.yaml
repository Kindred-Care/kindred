# Local stack: PostgreSQL, a one-shot migration run, and the API (Section 10, criterion 1).
#
#   npm run setup        # once: creates .env from .env.example and installs the git hooks
#   docker compose up --build
#   curl http://localhost:5080/v1/health
#
# Local only. Ports bind to 127.0.0.1 so nothing is exposed to the network.

name: kindred

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run "npm run setup" to create .env}
      POSTGRES_USER: ${POSTGRES_USER:?Run "npm run setup" to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "npm run setup" to create .env}
      KINDRED_DB_MIGRATOR_PASSWORD: ${KINDRED_DB_MIGRATOR_PASSWORD:?Run "npm run setup" to create .env}
      KINDRED_DB_APP_PASSWORD: ${KINDRED_DB_APP_PASSWORD:?Run "npm run setup" to create .env}
    ports:
      - "127.0.0.1:${KINDRED_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./scripts/dev/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      KINDRED_MIGRATOR_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB};Username=kindred_migrator;Password=${KINDRED_DB_MIGRATOR_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Local}
      ConnectionStrings__Kindred: Host=db;Port=5432;Database=${POSTGRES_DB};Username=kindred_app;Password=${KINDRED_DB_APP_PASSWORD};GSS Encryption Mode=Disable
    ports:
      - "127.0.0.1:${KINDRED_API_PORT:-5080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
